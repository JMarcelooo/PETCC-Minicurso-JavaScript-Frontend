<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
</head>
<body>
    <div id="div-login">
        <h1>Login</h1>
        <form id="meuFormulario">
            <input placeholder="E-mail" type="email" id="email" name="user_email" required>
            <br>
            <input placeholder="Senha" type="password" id="nome" name="user_password" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
